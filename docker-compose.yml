services:
  crisp_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}
    container_name: crisp_dev
    network_mode: "host"
    privileged: true
    command: bash
    working_dir: /ros2_ws
    tty: true
    stdin_open: true
    volumes:
      - ./:/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./limits.conf:/etc/security/limits.conf
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      # No GPU driver in the container: Mesa falls back to nouveau and rviz2
      # segfaults on dri3 screen creation. Force software rendering.
      LIBGL_ALWAYS_SOFTWARE: 1
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856